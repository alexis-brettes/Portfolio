stages:
  - build
  - deploy

build:
  stage: build
  image: node:22
  script:
    - npm ci
    - npm run check
    - npm run build
  artifacts:
    paths:
      - build/

pages:
  stage: deploy
  image: node:22
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - build
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
